# The `triage` duty.
#
# This file is the contract. The documentation describes it and links here; it
# deliberately does not restate every input, because a copy is only free to
# drift.
#
# A workflow names this directory: `uses: ecoma-io/reeve/triage@v0.1`.
name: Reeve - triage
description: Label an issue from your own taxonomy, in your own words, checked in code against a warrant file that says what the run is allowed to do.
author: Ecoma

branding:
  icon: tag
  color: purple

inputs:
  github-token:
    description: >-
      The token used to read the thread and apply what the warrant permits.
      `GITHUB_TOKEN` is enough. `issues: write` is one indivisible scope — a
      token that can label can also comment, close and assign — which is why the
      warrant file exists: what this run may actually do is decided in code,
      against a file in your repository, and not by what the token can reach.
    required: false
    default: ${{ github.token }}

  number:
    description: >-
      The issue to triage. Defaults to the thread that triggered the workflow,
      and is what a backfill sets to name an old one.

      An event that carries no thread — a `schedule`, a `push`, a bare
      `workflow_dispatch` — fails red naming the event rather than asking
      GitHub for issue `NaN`.
    required: false
    default: ""

  base-url:
    description: >-
      An OpenAI-compatible `/chat/completions` endpoint. Any provider that
      speaks the protocol works, including one you run yourself and one that
      needs no key.
    required: false
    default: https://api.openai.com/v1

  api-key:
    description: >-
      The provider's key. Leave it empty for a keyless endpoint, which is a
      supported configuration rather than a mistake. Registered as a secret
      before anything can log it.
    required: false
    default: ""

  models:
    description: >-
      Model ids, comma or newline separated, in preference order. The order is
      preference and not last resort: the first one that answers is used, and a
      model that fails is never asked again in the same run.

      `id = Name` gives a model a display name, and everything a person reads
      shows the name instead of the id. A model nobody named shows its id.
    required: true

  screen-models:
    description: >-
      A cheaper roster, asked two questions the expensive one should not be paid
      for: which language the thread was written in, and whether it is spam or
      about something else entirely. Empty is the default and turns the spam
      screen off — the free screens still run, and language detection falls back
      to `models` for the rare thread that script and profile cannot settle.

      This stage fails open in every direction. Every model failing, an answer
      nobody can read, and an answer that hedges all mean carry on: passing junk
      through costs one request, and dropping a real report costs a contributor
      the answer they came for.
    required: false
    default: ""

  languages:
    description: >-
      The languages your contributors write in, comma or newline separated.
      Detection narrows by script, then by profile, and only then asks a model —
      so a list of two costs nothing on most threads.

      The verdict prompt is told what it is reading rather than left to infer
      it, which is the whole reason this is configured here.

      Ignored once `warrant`'s own `languages:` key is written — the file is
      the whole answer from there, and the run says once which of the two it
      read.
    required: false
    default: en, vi, zh

  warrant:
    description: >-
      Where the taxonomy and the permissions live. Every label this duty may
      apply is named in this file, in your own words, with the cases it does not
      cover — and every effect is checked against the parsed file rather than
      against the model's account of what it was allowed to do. It may also
      carry a `languages:` key, which becomes the whole answer for detection
      once it is written — see `languages` above.

      Missing at this default path, there is no failure: the run acts at the
      narrowest authority this duty knows — labelling only, from this
      repository's own label descriptions, leaving out any label GitHub has no
      description for and saying so in the job summary. Point this at a path of
      your own instead, and a file missing there fails the run red, because
      naming a file that is not there is a configuration mistake rather than an
      absence. A file that exists but does not parse always fails red, wherever
      it lives — write one to move past the narrowest authority on your terms.
    required: false
    default: .github/reeve.yml

  apply:
    description: >-
      What this run may do, comma separated: any of `label`, `comment`,
      `close`, `assign`, `record`, or `none` for a run that decides and
      touches nothing.

      The narrower of this and the warrant file wins, always. This is the
      workflow's half of the answer — useful for turning one effect off on one
      trigger without editing the file — and the file remains the authority.

      `record` needs naming here as well as in the file: a labelled or
      unlabelled event only records when both halves grant it, and with the
      default of `label` alone a labelled event re-triages instead — see
      `docs/usage/duties/triage.md`.
    required: false
    default: label

  confidence:
    description: >-
      How sure the verdict has to be before anything is applied, between 0 and
      1. Under the floor the labels are still reported on `proposed` and in the
      job summary, which is how a maintainer tunes this against real threads
      before letting it write anything.

      Refused rather than clamped: `75` is a typo that would otherwise mean
      `1`, and a duty that silently stopped labelling anything is worse than a
      red run.
    required: false
    default: "0.75"

  corrections:
    description: >-
      A directory of `.ndjson` files recording labels a maintainer changed after
      a run. The nearest few are shown to the model as examples of decisions this
      project has already made, which is how a taxonomy's edges get learned
      without anybody rewriting the taxonomy.

      A directory that is not there is the cold start and reads as an empty
      store. Retrieval is lexical and runs in the action, so this costs no
      embedding calls and nothing leaves your repository.
    required: false
    default: .reeve/corrections

  min-body-chars:
    description: >-
      How much authored text is enough to be worth a model, in characters.
      Template scaffolding and quoted code are stripped before the count, and a
      body carrying a stack trace, a link or a command passes whatever its
      length — evidence beats size. `0` turns the rule off, which is right for a
      tracker whose reports are routinely terse.
    required: false
    default: "40"

  max-body-chars:
    description: >-
      How much of the author's own text one run reads, or `none` for no
      bound at all. A longer body has its tail left behind and the job
      summary says so rather than pretending otherwise. `0` is refused —
      write `none` for that meaning instead.
    required: false
    default: "6000"

  about:
    description: >-
      What this repository is about, in one sentence and in your own words. Used
      only by the spam screen, to tell a real request about something else from
      a real request about this. Empty is allowed and makes that half of the
      screen a question answered from the title alone, which is why it is worth
      writing.
    required: false
    default: ""

  dry-run:
    description: >-
      Run the whole pipeline, write every output, and change nothing. The
      rehearsal takes the same path a real run does — the same screens, the same
      floor, the same warrant — so what it reports is what a real run would do.
    required: false
    default: "false"

  sweep:
    description: >-
      Work the backlog instead of the one thread this event named: every open
      issue this duty has not already labelled, newest created first. Not an
      escalation of authority — a sweep decides how much work a run looks for,
      never what it is allowed to do to a thread, so the same warrant and the
      same `apply` bound it exactly as they bound a single-thread run.

      Cannot be combined with `number` — set one or the other.
    required: false
    default: "false"

  since:
    description: >-
      The oldest issue a sweep will consider, bounded by when it was opened —
      never by when it was last touched, because this duty's own labelling
      would otherwise push that bound forward under it. Empty for no bound, a
      calendar date (`2026-01-01`), or a duration (`90d`). This is what "no
      archaeology on threads before Reeve adoption" means: point it at the day
      this duty started running here, and everything older stays a deliberate,
      separate backfill rather than something a scheduled run stumbles into.
    required: false
    default: ""

  limit:
    description: >-
      The most issues one sweep will actually process. A skip — an issue this
      duty already labelled — costs nothing and does not count against it.
      Kept modest by default to protect a free tier's own rate limit: a
      keyless provider caps requests by IP, and a run that tried the whole
      backlog in one job would spend most of it rotating through 429s instead
      of finishing a smaller batch for good. Raise it for a paid provider or a
      deliberate backfill.
    required: false
    default: "50"

outputs:
  labels:
    description: >-
      JSON array of the labels that were applied. `[]` is the ordinary answer on
      a thread nobody could label, never unset.

  proposed:
    description: >-
      JSON array of every label the verdict named, including the ones that were
      refused. The difference between this and `labels` is the guardrails, and
      the job summary says which guardrail it was for each one.

  confidence:
    description: How sure the verdict was, to two decimal places. `0.00` when there was no verdict.

  language:
    description: >-
      The detected language of the thread, or empty — empty means none of the
      configured languages wrote it, which is an answer rather than a failure.

  duplicate-of:
    description: >-
      The issue number the verdict thinks this repeats, or empty. Reported
      whether or not `apply` names `close`, so a workflow can act on it without
      granting this duty the ability to close anything.

  screened-out:
    description: >-
      Why the run stopped before reaching the expensive model — `empty`,
      `template`, `too-short`, `spam` or `off-topic` — or empty when it did not.
      A screened-out thread is a green run that applied nothing.

  applied:
    description: >-
      What actually changed, as JSON: `labels`, `commented`, `assigned`,
      `closed`. `{}` under `dry-run`, which is a shape no real run produces — a
      real run always reports all four keys, whether or not it did anything with
      them.

  starved:
    description: >-
      `true` when every model in `models` failed on capacity this run — a 429,
      a 5xx, a timeout, or a network failure, on every one of them. Weather,
      never a failure by itself: outside `sweep` this run still delivered
      whatever a verdict it reached before the roster ran dry, and under
      `sweep` see `remaining` for what is left. Worth alerting on if a
      schedule keeps producing it, because that is a quota worth raising
      rather than a run worth retrying.

  processed:
    description: >-
      How many issues a sweep actually processed this run — decided about,
      whether or not anything was applied. `0` outside `sweep`.

  skipped:
    description: >-
      How many issues a sweep found already labelled and left alone, at no
      cost beyond the listing itself. `0` outside `sweep`.

  remaining:
    description: >-
      Candidates this sweep did not reach — past `limit`, or left behind when
      the roster ran out of capacity. The next sweep starts here. `0` outside
      `sweep`, and `0` when a sweep finished its whole backlog.

  recorded:
    description: >-
      `true` when a labelled or unlabelled event from a human, with `record`
      granted, wrote (or under `dry-run`, would have written) this thread's
      current labels to the corrections store. `false` on every other run —
      including an ordinary verdict, a sweep, and a labelled event where
      `record` is not granted — never unset.

runs:
  using: node24
  main: dist/index.js
