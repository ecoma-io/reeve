name: Issue triage

# This repository running its own duty on its own threads, as the translation
# workflow beside it does. `uses: ./triage` points at the working tree rather
# than a tag, so a change to the duty is dogfooded on the pull request that
# makes it; a workflow elsewhere writes the same path against a tag:
# `uses: ecoma-io/reeve/triage@v0.1`.
#
# The taxonomy is not here. It is `.github/reeve.yml`, which is the whole point
# of a warrant: what may be applied is reviewed as a file with a diff, and this
# workflow only says when to look at it. Nothing in this file can widen what
# the warrant grants — the warrant is the whole authority.
#
# The provider secrets are the organisation's, and the masking step is there for
# the reason it is there in the translation workflow: the duty masks its own api
# key and cannot mask model ids it was never told are sensitive.

on:
  # `opened` only was the original trigger, and deliberately not `edited`. A
  # label is a decision a maintainer can already see and change on the thread;
  # re-deciding it every time an author fixes a typo would spend a request to
  # reach the same answer, and on the run where it reached a different one it
  # would look like the taxonomy had changed its mind for no visible reason.
  #
  # `labeled`, `unlabeled`, and `reopened` are added for `record`: these are
  # the three `issues` actions `recordTrigger()` fires on, and they come from
  # humans only — bot-authored label changes and reopens are filtered at
  # runtime by `isBotAuthor()`. A `labeled` or `unlabeled` event records a
  # human's label change as a correction (S1); a `reopened` event records a
  # maintainer's reversal of a Reeve duplicate-close (S3). All three fall
  # through to an ordinary verdict when `record` is not granted, when the
  # sender is a bot, or when the event does not meet the recording conditions.
  issues:
    types: [opened, labeled, unlabeled, reopened]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to triage
        required: true

concurrency:
  group: reeve-triage-issue-${{ github.event.issue.number || inputs.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  triage:
    name: Triage
    # Renovate's dependency dashboard and release-please's release pull requests
    # are threads with a machine's shape and no maintainer's decision in them.
    # A property of this repository's threads rather than of the duty, so it is
    # a condition here rather than an input.
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    # Shorter than the translation job, and for a reason worth stating: triage
    # asks for one verdict on one thread, where translation asks for a draft per
    # language and a panel to pick between them.
    timeout-minutes: 10
    # Lifted to the job because `jobs.<id>.if` cannot read `secrets`, which is
    # what lets a fork with no provider configured skip the work and say so
    # instead of failing it.
    env:
      MODELS: ${{ secrets.ECOMA_REEVE_MODELS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: >-
          env.MODELS == '' &&
          github.event.action != 'labeled' &&
          github.event.action != 'unlabeled' &&
          github.event.action != 'reopened'
        run: echo "::notice::No provider is configured for this repository, so nothing was triaged."

      # `record` is governance, not intelligence: label corrections and reopen
      # reversals can be recorded without a model. The duty may use the roster
      # to render a cross-language pivot when one exists, but starvation only
      # omits that enrichment — it never prevents the correction itself from
      # being stored. Ordinary triage still needs a provider.
      - if: >-
          env.MODELS != '' ||
          github.event.action == 'labeled' ||
          github.event.action == 'unlabeled' ||
          github.event.action == 'reopened'
        name: Keep the provider out of the log
        env:
          SCREEN_MODELS: ${{ secrets.ECOMA_REEVE_SCREEN_MODELS }}
        run: |
          # The trailing newline is load-bearing: `read` drops a final line that
          # has none, and that line is the last screen model.
          printf '%s,%s\n' "$MODELS" "$SCREEN_MODELS" | tr ',|' '\n\n' | while IFS= read -r entry; do
            id=$(printf '%s' "${entry%%=*}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$id" ]; then echo "::add-mask::$id"; fi
          done

      - if: >-
          env.MODELS != '' ||
          github.event.action == 'labeled' ||
          github.event.action == 'unlabeled' ||
          github.event.action == 'reopened'
        uses: ./triage
        with:
          number: ${{ github.event.issue.number || inputs.number }}
          base-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          # Empty when the endpoint is keyless, which is a supported
          # configuration rather than a missing secret.
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          models: ${{ secrets.ECOMA_REEVE_MODELS }}
          # A cheaper roster for the two questions the expensive one should not
          # be paid for. Unset is a supported configuration: the spam screen is
          # then off and the free screens still run.
          screen-models: ${{ secrets.ECOMA_REEVE_SCREEN_MODELS }}
          about: >-
            Reeve is a GitHub Action that reads issues and pull requests with a
            language model and acts on them under a warrant committed to the
            repository — translating threads and applying labels from a taxonomy
            the maintainers wrote.
