name: Issue lifecycle

# The lifecycle duty, dogfooded here the same way the other four duties are.
# `uses: ./lifecycle` points at the working tree rather than a tag, so a change
# to the duty is dogfooded on the pull request that makes it.
#
# Lifecycle is model-free and deterministic — no provider secrets, no model
# masking, no request budget. The only configuration it needs is the warrant
# file (which declares the `lifecycle:` policy) and the `dry-run` flag.
#
# Starts in `dry-run: true` so a maintainer can observe what the policy would
# do before allowing it to act. Removing dry-run is two separate acts of intent
# — edit this file, and add `close` to the warrant's lifecycle capabilities —
# which is deliberate: a stale clock that can close threads should not be
# armed by accident.

on:
  schedule:
    # Daily, well clear of the hour the per-thread workflows are busiest at.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to check
        required: false
      dry-run:
        description: Report what would happen, change nothing
        type: boolean
        default: true

concurrency:
  group: reeve-lifecycle-${{ github.event.issue.number || inputs.number || 'sweep' }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  lifecycle:
    name: Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./lifecycle
        with:
          number: ${{ github.event.issue.number || inputs.number || '' }}
          dry-run: ${{ inputs.dry-run || 'true' }}
          sweep: ${{ (github.event.issue.number || inputs.number) && 'false' || 'true' }}
          limit: "20"
