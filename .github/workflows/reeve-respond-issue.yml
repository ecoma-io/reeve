name: Issue first reply

# Report-only dogfood: the warrant grants `respond: [comment]`, and this
# workflow leaves `apply` at its `none` default. Below the posting gate the
# duty still drafts, and the sanitized draft is rendered in the job summary —
# that is the read that decides whether this project ever lets it post.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to draft a reply for
        required: true

concurrency:
  group: reeve-respond-issue-${{ github.event.issue.number || inputs.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  respond:
    name: First reply
    if: github.event.issue.user.type != 'Bot' && !endsWith(github.event.issue.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODELS: ${{ secrets.ECOMA_REEVE_MODELS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.MODELS == ''
        run: echo "::notice::No provider is configured for this repository, so nothing was drafted."

      - if: env.MODELS != ''
        name: Keep the provider out of the log
        env:
          SCREEN_MODELS: ${{ secrets.ECOMA_REEVE_SCREEN_MODELS }}
        run: |
          printf '%s,%s\n' "$MODELS" "$SCREEN_MODELS" | tr ',|' '\n\n' | while IFS= read -r entry; do
            id=$(printf '%s' "${entry%%=*}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$id" ]; then echo "::add-mask::$id"; fi
          done

      - if: env.MODELS != ''
        uses: ./respond
        with:
          number: ${{ github.event.issue.number || inputs.number }}
          base-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          models: ${{ secrets.ECOMA_REEVE_MODELS }}
          screen-models: ${{ secrets.ECOMA_REEVE_SCREEN_MODELS }}
          about: >-
            Reeve is a GitHub Action that reads issues and pull requests with a
            language model and acts on them under a warrant committed to the
            repository — translating threads and applying labels from a taxonomy
            the maintainers wrote.
          # `apply` stays unset: report-only; the draft lives in the job summary.
