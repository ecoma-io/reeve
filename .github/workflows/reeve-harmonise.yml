name: Documentation harmonise

# This repository running its own `harmonise` duty on its own documentation.
# Everything here is an ordinary consumer's workflow — `uses: ./harmonise` is
# the only line that is not, and it points at the working tree rather than a tag
# so a change is dogfooded on the pull request that makes it, not one release
# later.
#
# `harmonise` keeps locale-suffixed documentation files in sync with the source
# locale — classifying the diff, propagating shared semantic changes, and
# opening a draft pull request. Translation corrections and locale-specific
# adaptations stay local and are never overwritten.
#
# This workflow triggers on pushes to `main` that change documentation files or
# the root README. It does not trigger on changes to locale variants — a human
# edit in a target locale is a correction or adaptation, not something that
# should re-sync the whole set.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
  workflow_dispatch: {}

# `harmonise` needs `contents: write` to commit locale files and provenance
# state, and `pull-requests: write` to open or update sync pull requests.
permissions:
  contents: write
  pull-requests: write

jobs:
  harmonise:
    name: Harmonise
    runs-on: ubuntu-latest
    # Classification plus drafting plus judging per stale locale, multiplied by
    # the number of changed document groups. A generous timeout for a free
    # tier that may be slow or rate-limiting.
    timeout-minutes: 20
    env:
      MODELS: ${{ secrets.ECOMA_REEVE_MODELS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.MODELS == ''
        run: echo "::notice::No provider is configured for this repository, so no documentation was harmonised."

      - if: env.MODELS != ''
        name: Keep the provider out of the log
        env:
          JUDGE_MODELS: ${{ secrets.ECOMA_REEVE_JUDGE_MODELS }}
        run: |
          # The trailing newline is load-bearing: `read` drops a final line
          # that has none, and that line is the last judge seat.
          printf '%s,%s\n' "$MODELS" "$JUDGE_MODELS" | tr ',|' '\n\n' | while IFS= read -r entry; do
            id=$(printf '%s' "${entry%%=*}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$id" ]; then echo "::add-mask::$id"; fi
          done

      - if: env.MODELS != ''
        uses: ./harmonise
        with:
          base-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          # Empty when the endpoint is keyless, which is a supported
          # configuration rather than a missing secret.
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          models: ${{ secrets.ECOMA_REEVE_MODELS }}
          judge-models: ${{ secrets.ECOMA_REEVE_JUDGE_MODELS }}
          drafts: "2"
          source-language: en
          paths: "README.md"
