name: CI

on:
  pull_request:
    branches: [main]
  # The merge queue re-runs these checks against `main + every pull request
  # ahead in the queue + this one`, which is the only place a semantic conflict
  # between two independently-green pull requests can surface. GitHub reports
  # the result against the required check name below, so `ci-gate` must exist on
  # this event or the queue waits forever.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A merge-queue run must never be cancelled: the queue is blocked on exactly
  # this run, and cancelling it ejects the batch. `github.ref` is already unique
  # per queued batch, and `cancel-in-progress` is true only for pull requests.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json, so the
      # runner uses the same pnpm a contributor's Corepack fetches.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every pull request lands as a squash, and the squash commit's subject is
      # the pull request title — so the title is the one commit message that
      # never reaches the `commit-msg` hook: no commit carrying that text exists
      # until GitHub writes it at merge time. Same commitlint configuration as
      # the hook, so a valid message has one definition rather than two.
      #
      # The title arrives through the environment, never through `${{ }}`
      # interpolation into the script: interpolation pastes it into the shell
      # source, where a title containing `$(...)` or a backtick would run.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # Skipped in the merge queue, and it is the only check that is. Prettier's
      # verdict is a pure function of each file's own bytes: merging other pull
      # requests into this one cannot unformat a file that was formatted, so
      # re-running it would re-prove what the pull-request run already proved.
      # Everything below can change under a merge — a type, a test, the bundle —
      # which is the entire reason the queue exists.
      - name: Check formatting
        if: github.event_name != 'merge_group'
        run: pnpm format:check

      # Type-aware, so a verdict here depends on files this branch never
      # touched: a signature another queued pull request changed can turn a call
      # site in this one into an unsafe-argument error that neither branch shows
      # alone. That interference is exactly what the queue re-runs to catch.
      - run: pnpm lint

      - run: pnpm typecheck
      - run: pnpm test

      # The runner executes `dist/index.js` off the checked-out repository —
      # never `src/`, and never after an install. So the bundle is committed,
      # and this is the check that keeps it honest: rebuild, and fail if the
      # result differs from what the branch carries. Without it, a source change
      # that nobody rebuilt merges green and the action keeps running the old
      # behaviour, which is the single most common way an action repository
      # ships a fix that does nothing.
      - name: Rebuild the action bundle
        run: pnpm build

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::dist/ is out of date. Run 'pnpm build' and commit the result."
            exit 1
          fi

  ci-gate:
    name: ci-gate
    # The single check name a branch ruleset requires, on pull requests and in
    # the merge queue alike. It exists so the required-check name is stable
    # while the job list is not: add a job to `needs` and the gate tightens
    # without anyone editing repository settings — and forgetting to add it is
    # the only way to widen what green means, which is visible in this file.
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The gate asserts every dependency reached `success`, rather than
      # enumerating the ways one can fail. Those are not the same claim, and the
      # difference was measured rather than reasoned.
      #
      # This was a `contains(needs.*.result, 'failure') || ... 'cancelled' || ...
      # 'skipped'` guard on a step that ran `exit 1`. On run 31118985640 attempt
      # 1 — during a GitHub Actions major outage — `Verify` failed at `Set up
      # job` before a single line of it ran, and `ci-gate` reported **success**
      # with that step **skipped**: the `needs` context reached it carrying no
      # result the guard recognised, so every disjunct was false, so the step
      # that would have failed the build never ran. The one required check went
      # green over a red pipeline.
      #
      # A deny-list of known-bad states fails open on any state it does not
      # know, and `needs.*.result` is not a value this repository controls. So
      # the condition is inverted: name the single state that means "safe", and
      # let everything else — including whatever that outage produced — fail.
      # The step runs unconditionally, because a step that decides whether to
      # run is a step that can decline to.
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: ${RESULTS:-<empty>}"
          if [ -z "$RESULTS" ]; then
            echo "::error::ci-gate got no result from its dependencies. Refusing to pass."
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job reported '$result' rather than success."
              exit 1
            fi
          done
          echo "Every required job succeeded."
