name: CI

on:
  pull_request:
    branches: [main]
  # The merge queue re-runs these checks against `main + every pull request
  # ahead in the queue + this one`, which is the only place a semantic conflict
  # between two independently-green pull requests can surface. GitHub reports
  # the result against the required check name below, so `ci-gate` must exist on
  # this event or the queue waits forever.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A merge-queue run must never be cancelled: the queue is blocked on exactly
  # this run, and cancelling it ejects the batch. `github.ref` is already unique
  # per queued batch, and `cancel-in-progress` is true only for pull requests.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The documented-uses-refs guard resolves `uses: …@<tag>` against real
          # git tags, and the anchor guard walks every docs heading — both need
          # the full history, not the default shallow clone.
          fetch-depth: 0

      # Reads the pnpm version from `packageManager` in package.json, so the
      # runner uses the same pnpm a contributor's Corepack fetches.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every pull request lands as a squash, and the squash commit's subject is
      # the pull request title — so the title is the one commit message that
      # never reaches the `commit-msg` hook: no commit carrying that text exists
      # until GitHub writes it at merge time. Same commitlint configuration as
      # the hook, so a valid message has one definition rather than two.
      #
      # The title arrives through the environment, never through `${{ }}`
      # interpolation into the script: interpolation pastes it into the shell
      # source, where a title containing `$(...)` or a backtick would run.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # Skipped in the merge queue, and it is the only check that is. Prettier's
      # verdict is a pure function of each file's own bytes: merging other pull
      # requests into this one cannot unformat a file that was formatted, so
      # re-running it would re-prove what the pull-request run already proved.
      # Everything below can change under a merge — a type, a test, the bundle —
      # which is the entire reason the queue exists.
      - name: Check formatting
        if: github.event_name != 'merge_group'
        run: pnpm format:check

      # Type-aware, so a verdict here depends on files this branch never
      # touched: a signature another queued pull request changed can turn a call
      # site in this one into an unsafe-argument error that neither branch shows
      # alone. That interference is exactly what the queue re-runs to catch.
      - run: pnpm lint

      - run: pnpm typecheck
      - run: pnpm test

      # The eval contract suite pins the post-1.0 duties contract and the
      # fail-closed exit-code gate (`test:contract` drives the real `pnpm eval`
      # across every outcome branch). The root vitest config discovers only
      # `src/**`, so `pnpm test` does not reach it — it must run here.
      - run: pnpm test:contract

      # The dogfood gate itself: a fixture run must exit 0 only when every
      # outcome was a finding and none failed or skipped. Run in CI so the
      # fail-closed rule is exercised on every push, not only when someone
      # runs it by hand.
      - name: Run the eval gate
        run: pnpm eval all

      # Resolves every `uses: ecoma-io/reeve/<duty>@<ref>` in README/docs
      # against tags and bundles that actually exist — the release-time guard
      # that keeps a broken pin like @v0.1 for a v0.6-only duty from reaching a
      # first-contact user as a working example.
      - name: Check documented uses refs
        run: node tools/check-uses-refs.mjs

      # Resolves every `(path#frag)` link in docs against the headings in the
      # target file, using the same github-slugger GitHub renders with — a dead
      # anchor fails CI instead of a reader's click.
      - name: Check documentation anchors
        run: node tools/check-anchors.mjs

      # Resolves every docs reference the list above does not cover: markdown
      # link targets must exist and, for pages INSIDE docs/, land only within
      # docs/; prose `docs/…` citations must resolve; and a bare `#anchor` must
      # match a heading in the same file. The same gate runs on every agent
      # edit and in pre-commit, so CI checks the same health against main +
      # queued pull requests instead of fresh eyes.
      - name: Check docs links and containment
        run: pnpm check-docs-links

      # The runner executes `dist/index.js` off the checked-out repository —
      # never `src/`, and never after an install. So the bundle is committed,
      # and this is the check that keeps it honest: rebuild, and fail if the
      # result differs from what the branch carries. Without it, a source change
      # that nobody rebuilt merges green and the action keeps running the old
      # behaviour, which is the single most common way an action repository
      # ships a fix that does nothing.
      - name: Rebuild the action bundle
        run: pnpm build

      - name: Fail if the committed bundle is stale
        run: |
          # Every bundle, not just the root one: `git status --porcelain`
          # answers for untracked output too, so a duty added to
          # `tools/build.mjs` whose bundle was never committed fails here
          # instead of shipping as a directory GitHub cannot resolve.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat
            echo "::error::The committed bundles are out of date. Run 'pnpm build' and commit the result."
            exit 1
          fi

  # Mutation testing, in its own job on its own runner rather than a step in
  # `Verify`. Three reasons, in order of how much they cost to get wrong:
  #
  # 1. The harness *renames source files* while it runs (tools/mutation.mjs
  #    moves a file aside, writes a mutated copy, runs vitest, puts it back).
  #    Anything else reading `src/` in the same checkout at the same moment
  #    reads a file that is briefly not there. A separate runner is the only
  #    isolation that is actually isolation.
  # 2. It runs in parallel with `Verify`, so the wall clock the pipeline adds
  #    is zero — the mutation table is about three and a half minutes and
  #    `Verify` takes longer still.
  # 3. It gets its own check name. "a mutation survived" and "a test failed"
  #    are different findings with different owners, and a reviewer should not
  #    have to open a log to tell which one happened.
  #
  # The full table runs on every event, including pull requests. That is a
  # measurement, not an oversight: the whole table is 60 mutations and about
  # three and a half minutes of vitest, against a `Verify` job that is longer
  # still, so this job is not the pipeline's critical path.
  # `tools/mutation.mjs --stage fast` (44 rows, about a minute) is the local
  # pre-push loop and the switch to reach for if this job ever starts deciding
  # when the pipeline finishes. Note what NOT to defer if that day comes: the
  # four entry-point rows are `full`-tier because they rebuild a bundle, and
  # they are also the rows that caught a publish gate standing wide open.
  # The condition to flip on is not a fixed number of seconds but a comparison
  # CI already reports: flip when this job's wall clock approaches `Verify`'s,
  # so that it starts deciding when the pipeline finishes. A constant would
  # fire before the thing it stands for is true. The edit then is to split this
  # job's run step — `pnpm test:mutation:fast` under
  # `if: github.event_name == 'pull_request'`, the full table under the
  # negation — which keeps `merge_group` and `push: main`, the two events that
  # actually gate `main`, on the whole table. A gate that only runs nightly is
  # a gate whose regression merges.
  #
  # The job also runs `pnpm test:tools`, which is what checks that the gate
  # below can still fail. An adversarial review emptied the mutation table and
  # watched the harness report `KILLED 0 · SURVIVED 0 · STALE 0` and exit 0, so
  # the harness now refuses a table smaller than a recorded floor — and that
  # refusal, along with the stale- and ambiguous-`from` detection, is code that
  # only ever runs when something has already gone wrong, which is precisely
  # the code that rots unwatched. It runs first, and takes under a second.
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The gates that check the gates: the mutation harness's own refusal
      # paths, and the pins on `vitest.config.ts`'s coverage exclusions and
      # thresholds. Both of those config rules were prose until this ran —
      # adding one glob to `exclude` raises every coverage percentage and turns
      # nothing red.
      - run: pnpm test:tools

      # Fails on a SURVIVED row (the suite does not assert what the mutation
      # breaks), on a STALE row (the mutation's `from` string no longer matches
      # its file exactly once, so the mutation silently never ran), and on a
      # table that has shrunk below `TABLE_FLOOR`. Staleness is the failure
      # worth naming here: a gate that stopped applying reports nothing, and
      # reported nothing for as long as nobody looked. It has already caught
      # one for real: a row pinning the dry-run withholding in
      # `src/duties/review/threads.ts` matched four consecutive lines, and two
      # unrelated, entirely legitimate edits moved that seam without touching
      # dry-run at all. The row was re-pointed at what the seam *is* rather
      # than at the order of the statements around it.
      - run: pnpm test:mutation

  ci-gate:
    name: ci-gate
    # The single check name a branch ruleset requires, on pull requests and in
    # the merge queue alike. It exists so the required-check name is stable
    # while the job list is not: add a job to `needs` and the gate tightens
    # without anyone editing repository settings — and forgetting to add it is
    # the only way to widen what green means, which is visible in this file.
    needs: [verify, mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The gate asserts every dependency reached `success`, rather than
      # enumerating the ways one can fail. Those are not the same claim, and the
      # difference was measured rather than reasoned.
      #
      # This was a `contains(needs.*.result, 'failure') || ... 'cancelled' || ...
      # 'skipped'` guard on a step that ran `exit 1`. On run 31118985640 attempt
      # 1 — during a GitHub Actions major outage — `Verify` failed at `Set up
      # job` before a single line of it ran, and `ci-gate` reported **success**
      # with that step **skipped**: the `needs` context reached it carrying no
      # result the guard recognised, so every disjunct was false, so the step
      # that would have failed the build never ran. The one required check went
      # green over a red pipeline.
      #
      # A deny-list of known-bad states fails open on any state it does not
      # know, and `needs.*.result` is not a value this repository controls. So
      # the condition is inverted: name the single state that means "safe", and
      # let everything else — including whatever that outage produced — fail.
      # The step runs unconditionally, because a step that decides whether to
      # run is a step that can decline to.
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: ${RESULTS:-<empty>}"
          if [ -z "$RESULTS" ]; then
            echo "::error::ci-gate got no result from its dependencies. Refusing to pass."
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job reported '$result' rather than success."
              exit 1
            fi
          done
          echo "Every required job succeeded."
