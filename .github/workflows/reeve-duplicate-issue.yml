name: Issue duplicates

# Report-only dogfood: the warrant grants `duplicate: [comment]`, and this
# workflow runs `dry-run: true`, so the duty drafts and writes its verdict to
# the job summary without ever posting to a thread. The warrant says what the
# duty MAY do; this half says it may not do it yet, by withholding the act.
# The job summary carries the verdict and its rationale, which is the read a
# maintainer does for a few weeks before removing the dry-run.
#
# `uses: ./duplicate` points at the working tree, as the triage workflow beside
# it does, so a change to the duty is dogfooded on the pull request that makes
# it.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to check
        required: true

concurrency:
  group: reeve-duplicate-issue-${{ github.event.issue.number || inputs.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  duplicate:
    name: Duplicate check
    if: github.event.issue.user.type != 'Bot' && !endsWith(github.event.issue.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODELS: ${{ secrets.ECOMA_REEVE_MODELS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.MODELS == ''
        run: echo "::notice::No provider is configured for this repository, so nothing was checked."

      - if: env.MODELS != ''
        name: Keep the provider out of the log
        run: |
          printf '%s\n' "$MODELS" | tr ',|' '\n\n' | while IFS= read -r entry; do
            id=$(printf '%s' "${entry%%=*}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$id" ]; then echo "::add-mask::$id"; fi
          done

      - if: env.MODELS != ''
        uses: ./duplicate
        with:
          number: ${{ github.event.issue.number || inputs.number }}
          base-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          models: ${{ secrets.ECOMA_REEVE_MODELS }}
          # Report-only until this backlog says what the false-positive rate
          # actually is.
          dry-run: true
