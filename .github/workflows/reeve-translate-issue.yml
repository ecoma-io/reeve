name: Issue translation

# This repository running its own duty on its own threads. Everything here is an
# ordinary consumer's workflow — `uses: ./translate` is the only line that is
# not, and it points at the working tree rather than a tag so a change is
# dogfooded on the pull request that makes it, not one release later.
#
# `./translate` rather than `./`, because a duty ships from its own directory
# beside its own `action.yml` and the root listing is the one action here that
# refuses to do anything. A workflow elsewhere writes the same path against a
# tag: `uses: ecoma-io/reeve/translate@v0.6`.
#
# The provider is configured entirely through organisation secrets — including
# the endpoint and the model ids, which are not credentials. That is deliberate:
# which provider this organisation happens to have access to is nobody's
# business but the maintainer's, and a public workflow log is a poor place to
# announce it. The masking step below extends that to the ids the duty names in
# its own warnings, which the runner would otherwise print in full.
#
# Masking is a log mechanism, and the run report is not the log — it is a page
# the job writes for itself. So every id in these secrets is given a display
# name (`id=House model`), which is what the report prints and what a reader
# wants there anyway. An unnamed id would appear on that page as itself.
#
# The names sit on two tiers, because they change on two different schedules.
# `ECOMA_LLM_*` is the endpoint and its key: one provider, shared by every
# repository in the organisation that calls a model, so rotating a key is one
# edit rather than one per consumer. `ECOMA_REEVE_*` is what this repository
# asks that provider for — ids its scoring has been measured against, and a
# judge panel no other consumer has a concept of. CONTRIBUTING has the table.

on:
  # `edited` is what makes a corrected issue get a corrected translation, and it
  # is also the event the duty's own write fires — it publishes into the body.
  # That loop terminates on content rather than on token: the run this triggers
  # recomputes the fingerprint of the author's half plus the target languages,
  # finds it already published, and returns before it constructs a provider. It
  # has to work that way because GITHUB_TOKEN's recursion prevention is not
  # available to a consumer who runs this with a PAT or an App installation.
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to (re-)translate
        required: true

# An edit supersedes the translation of the text it replaced. Only the newest
# body is worth spending free-tier calls on.
concurrency:
  group: reeve-translate-issue-${{ github.event.issue.number || inputs.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  translate:
    name: Translate
    # A bot's issue is not a thread anybody is reading in a second language, and
    # one of them here is Renovate's dependency dashboard: Renovate rewrites
    # that body wholesale whenever it re-runs, which would strip the block this
    # duty appends and be answered by another translation of a body Renovate is
    # about to rewrite again. Two machines editing one issue at each other.
    #
    # This is a property of this repository's threads, not of the duty, so it is
    # a condition on the workflow rather than an input. `workflow_dispatch` has
    # no issue in its payload and the comparison is against nothing, which is
    # how a manual run of a bot's thread stays possible.
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    # Detection plus drafts plus judging, every one of them on a free tier that
    # is slow when it is not rate-limiting. Generous on purpose; a model that
    # has not answered by now is one the duty would rotate past anyway.
    timeout-minutes: 20
    # Lifted to the job because `jobs.<id>.if` cannot read the `secrets`
    # context, and a step-level `if` can read `env`. That indirection is what
    # lets a fork — which has no provider configured and never will — skip the
    # work instead of failing it, while still saying so out loud.
    env:
      MODELS: ${{ secrets.ECOMA_REEVE_MODELS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.MODELS == ''
        run: echo "::notice::No provider is configured for this repository, so nothing was translated."

      # The duty masks its own api key, and cannot mask what it does not know is
      # sensitive. `models` and `judge-models` are ids it prints in warnings
      # ("this model failed, that judge voted"), and the runner only masks a
      # secret's exact value — the whole list — never the ids inside it. So each
      # one is registered here, before the step that can log it.
      #
      # Ids only, which is what the splitting is for. An entry is `id=Name` and
      # a judge seat chains its fallbacks with `|`, so `a | b = Referee` holds
      # two ids and one name: mask what is left of the `=`, and leave the name
      # alone. A masked name would be a report full of `***` with no way to tell
      # one model from another, which is the opposite of what naming them is for.
      - if: env.MODELS != ''
        name: Keep the provider out of the log
        env:
          JUDGE_MODELS: ${{ secrets.ECOMA_REEVE_JUDGE_MODELS }}
        run: |
          # The trailing newline is load-bearing: `read` drops a final line
          # that has none, and that line is the last judge seat.
          printf '%s,%s\n' "$MODELS" "$JUDGE_MODELS" | tr ',|' '\n\n' | while IFS= read -r entry; do
            id=$(printf '%s' "${entry%%=*}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$id" ]; then echo "::add-mask::$id"; fi
          done

      - if: env.MODELS != ''
        uses: ./translate
        with:
          number: ${{ github.event.issue.number || inputs.number }}
          base-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          # Empty when the endpoint is keyless, which is a supported
          # configuration rather than a missing secret.
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          models: ${{ secrets.ECOMA_REEVE_MODELS }}
          judge-models: ${{ secrets.ECOMA_REEVE_JUDGE_MODELS }}
          # Two answers and a vote between them: the quality lever that exists
          # when a stronger model is not on the menu, which is exactly the setup
          # this repository is dogfooding.
          drafts: "2"
