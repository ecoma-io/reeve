name: Issue translation

# This repository running its own duty on its own threads. Everything here is an
# ordinary consumer's workflow — `uses: ./translate` is the only line that is
# not, and it points at the working tree rather than a tag so a change is
# dogfooded on the pull request that makes it, not one release later.
#
# `./translate` rather than `./`, because a duty ships from its own directory
# beside its own `action.yml` and the root listing is the one action here that
# refuses to do anything. A workflow elsewhere writes the same path against a
# tag: `uses: ecoma-io/reeve/translate@v1`.
#
# The provider is configured entirely through repository secrets — including the
# endpoint and the model ids, which are not credentials. That is deliberate:
# which provider this repository happens to have access to is nobody's business
# but the maintainer's, and a public workflow log is a poor place to announce
# it. The masking step below extends that to the ids the duty names in its own
# warnings, which the runner would otherwise print in full.

on:
  # `edited` is what makes a corrected issue get a corrected translation, and it
  # is also the event the duty's own write fires — it publishes into the body.
  # That loop terminates on content rather than on token: the run this triggers
  # recomputes the fingerprint of the author's half plus the target languages,
  # finds it already published, and returns before it constructs a provider. It
  # has to work that way because GITHUB_TOKEN's recursion prevention is not
  # available to a consumer who runs this with a PAT or an App installation.
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to (re-)translate
        required: true

# An edit supersedes the translation of the text it replaced. Only the newest
# body is worth spending free-tier calls on.
concurrency:
  group: reeve-translate-issue-${{ github.event.issue.number || inputs.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  translate:
    name: Translate
    runs-on: ubuntu-latest
    # Detection plus drafts plus judging, every one of them on a free tier that
    # is slow when it is not rate-limiting. Generous on purpose; a model that
    # has not answered by now is one the duty would rotate past anyway.
    timeout-minutes: 20
    # Lifted to the job because `jobs.<id>.if` cannot read the `secrets`
    # context, and a step-level `if` can read `env`. That indirection is what
    # lets a fork — which has no provider configured and never will — skip the
    # work instead of failing it, while still saying so out loud.
    env:
      PROVIDER_MODELS: ${{ secrets.PROVIDER_MODELS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.PROVIDER_MODELS == ''
        run: echo "::notice::No provider is configured for this repository, so nothing was translated."

      # The duty masks its own api key, and cannot mask what it does not know is
      # sensitive. `models` and `judge-models` are ids it prints in warnings
      # ("this model failed, that judge voted"), and the runner only masks a
      # secret's exact value — the whole list — never the ids inside it. So each
      # one is registered here, before the step that can log it.
      - if: env.PROVIDER_MODELS != ''
        name: Keep the provider out of the log
        env:
          JUDGE_MODELS: ${{ secrets.PROVIDER_JUDGE_MODELS }}
        run: |
          for id in $(printf '%s,%s' "$PROVIDER_MODELS" "$JUDGE_MODELS" | tr ',' '\n'); do
            if [ -n "$id" ]; then echo "::add-mask::$id"; fi
          done

      - if: env.PROVIDER_MODELS != ''
        uses: ./translate
        with:
          number: ${{ github.event.issue.number || inputs.number }}
          base-url: ${{ secrets.PROVIDER_BASE_URL }}
          # Empty when the endpoint is keyless, which is a supported
          # configuration rather than a missing secret.
          api-key: ${{ secrets.PROVIDER_API_KEY }}
          models: ${{ secrets.PROVIDER_MODELS }}
          judge-models: ${{ secrets.PROVIDER_JUDGE_MODELS }}
          # Two answers and a vote between them: the quality lever that exists
          # when a stronger model is not on the menu, which is exactly the setup
          # this repository is dogfooding.
          drafts: "2"
