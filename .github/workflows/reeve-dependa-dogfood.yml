# Dependa vs Renovate — shadow/dry-run comparison.
#
# This workflow does NOT create real PRs. The warrant deliberately omits
# `dependa` from its `duties:` block, so the duty runs in shadow mode —
# observations only. This workflow extracts what Renovate would find from the
# repository's configuration and manifests, compares the two, and uploads the
# conformance report as a workflow artifact.
#
# Renovate remains the production authority. Dependa runs in shadow mode.
# No shared mutation path exists between the two systems.
#
# Schedule: Thursday at ~03:00 UTC — one day after Renovate's Wednesday
# schedule, so the comparison can observe what Renovate did most recently.

name: Dependa dogfood

on:
  schedule:
    # Thursday at 03:17 UTC — one day after Renovate's weekly run
    - cron: "17 3 * * 4"
  workflow_dispatch: {}

# Read-only permissions: dependa is in shadow mode and writes nothing.
# If someone adds dependa to the warrant's `duties:` block with
# edit-file/open-pr, the token-level rejection serves as defense-in-depth
# beyond the application-level gate.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reeve-dependa-dogfood
  cancel-in-progress: false

jobs:
  shadow:
    name: Shadow comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99890a83b15e6c6a4bf7e1d3040f40b87c # v6.0.10

      - uses: actions/setup-node@820762782a9f9c1c3883f26b28b6896b0f89d769 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run dependa in shadow mode — observations only, no mutations. The
      # warrant deliberately omits dependa from its `duties:` block, so no
      # grant exists for this duty to act on.
      - uses: ./dependa
        id: dependa
        with:
          ecosystems: "npm, github-actions"
          drafts: "0"

      # Run the conformance comparison CLI.
      # This extracts the Renovate baseline from config + manifests,
      # extracts dependa's shadow findings, and produces a conformance
      # report + JSONL dataset.
      - name: Run conformance comparison
        run: npx tsx dogfood/conformance/cli.ts --repo-root . --ecosystems npm,github-actions

      # Upload the conformance report and JSONL dataset.
      # The dependa action outputs are JSON arrays of group IDs (not file
      # paths), so we upload the actual files the CLI produces instead.
      - name: Upload conformance data
        uses: actions/upload-artifact@043fb46d768f4889835ef676b1c6f0659a0f2b3f # v7.0.1
        with:
          name: dependa-dogfood-${{ github.sha }}
          path: |
            dogfood/conformance-report.jsonl
          retention-days: 30

      # Write a summary to the job so it's visible in the Actions tab
      - name: Write job summary
        run: |
          if [ -f dogfood/conformance-report.jsonl ]; then
            echo "## Dependa Dogfood Conformance Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "See the uploaded artifact for the full JSONL dataset." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Dependa Dogfood — No Report Generated" >> "$GITHUB_STEP_SUMMARY"
          fi
