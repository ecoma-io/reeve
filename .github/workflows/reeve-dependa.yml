name: Dependency dependa

# This repository running its own `dependa` duty on its own dependencies.
# Everything here is an ordinary consumer's workflow — `uses: ./dependa` is
# the only line that is not, and it points at the working tree rather than a tag
# so a change is dogfooded on the pull request that makes it, not one release
# later.
#
# `dependa` discovers dependencies in manifests, resolves available versions,
# classifies updates by semver impact, gathers evidence, assesses risk, and
# opens or updates draft pull requests for each proposal group — all governed by
# the warrant's `dependa:` policy and the `edit-file` + `open-pr` capabilities.
#
# This workflow triggers on a weekly schedule and on manual dispatch. It does
# not trigger on pushes because dependency updates are not tied to source
# changes — the registry evolves independently of this repository.

on:
  schedule:
    # Wednesday at ~03:00 UTC — off-peak for registry APIs, midweek for review.
    - cron: "17 3 * * 3"
  workflow_dispatch: {}

# `dependa` needs `contents: write` to commit manifest edits, and
# `pull-requests: write` to open or update dependency update pull requests.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependa:
    name: Dependa
    runs-on: ubuntu-latest
    # Discovery, resolution, classification, and optional risk interpretation
    # across all ecosystems. A generous timeout for a free tier that may be
    # slow or rate-limiting.
    timeout-minutes: 20
    env:
      MODELS: ${{ secrets.ECOMA_REEVE_MODELS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.MODELS == ''
        run: echo "::notice::No provider is configured for this repository, so no model-assisted risk interpretation will run. The deterministic pipeline still discovers, classifies, and groups."

      - if: env.MODELS != ''
        name: Keep the provider out of the log
        run: |
          printf '%s\n' "$MODELS" | tr ',|' '\n\n' | while IFS= read -r entry; do
            id=$(printf '%s' "${entry%%=*}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$id" ]; then echo "::add-mask::$id"; fi
          done

      - if: env.MODELS != ''
        uses: ./dependa
        with:
          base-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          # Empty when the endpoint is keyless, which is a supported
          # configuration rather than a missing secret.
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          models: ${{ secrets.ECOMA_REEVE_MODELS }}
          drafts: "2"
          ecosystems: "npm, github-actions"
          apply: edit-file, open-pr
