# What Reeve is allowed to do to this repository — including to its own issues.
#
# This is a consumer's file, not part of the product: the format is documented
# in `docs/reference/warrant-format.md`, and everything below is this project's own answer
# to it. It is here so a change to a duty is dogfooded on the pull request that
# makes it, and so the taxonomy that ships as an example is one somebody has to
# live with.
#
# Every `not` names the label this one gets confused with, because that is the
# boundary this project made and nothing in a model's training knows where we
# put it. Where a `not` reads oddly specific, it is because a real thread here
# was labelled wrong that way.

version: 1

# Labels and body edits act; comments are granted and not yet taken. The
# `comment` grants below are one half of a gate the duties close from both
# sides: this file says what a duty MAY do, and the workflow's own `apply`
# says whether this repository lets it yet. Both dogfood workflows leave
# `apply` at `none`, so `duplicate` and `respond` decide and write their
# verdicts to the job summary without touching a thread — the read that
# decides, some weeks of backlog from now, whether posting is switched on.
# `assign` and `close` stay off entirely, which is the advice the docs give
# and it would be strange to take our own advice second.
#
# `record` is the exception: triage records a human's label change or a
# maintainer's reopen as a correction, committed to `.reeve/corrections/` in
# this repository. The write goes through the Contents API, which is why the
# workflow needs `contents: write` in addition to `issues: write` — `record`
# writes to the repository, not to the thread.
#
# `lifecycle` runs on a schedule, not on an event, and grants `label, comment`
# but not `close`. The `close` step in the lifecycle policy is present for
# forward-compatibility but is skipped until `close` is added here. The
# workflow starts in `dry-run: true` so a maintainer can observe what the
# policy would do before allowing it to act.
capabilities:
  triage: [label, record]
  translate: [edit-body]
  duplicate: [comment]
  respond: [comment]
  lifecycle: [label, comment]

labels:
  - name: bug
    description: >-
      A duty, or the machinery under one, does not do what its own documentation
      says it does. The reporter is using it as intended — a workflow that names
      the action the way `docs/getting-started/installation.md` names it — and getting a
      wrong result.
    not: >-
      A model that answered badly. Reeve rotates models rather than retrying, so
      a poor translation or a wrong label is the provider's answer being poor,
      not this project misbehaving. That is `enhancement` when it is a request
      for better prompting or better guardrails, and `question` when it is not.
    examples:
      - "translate republishes an unchanged body on every edit"
      - "The warrant parses but a label named in it is never applied"

  - name: enhancement
    description: >-
      A capability this project does not have and should — a new duty, a new
      input, a guardrail that would have caught something, a warrant field that
      would let a taxonomy say what it means.
    not: >-
      A capability it HAS, that does not work. That is `bug`, however the
      reporter phrased it — "it would be nice if the fingerprint noticed edits"
      is a bug report about a fingerprint that already claims to.
    examples:
      - "A duty that answers a first-time contributor with the contributing guide"
      - "Let the warrant name a label that may only ever be proposed, never applied"

  - name: documentation
    description: >-
      Something under `docs/` is wrong, missing, or says what the code does not
      do. Includes a documented input that no `action.yml` declares, and a page
      that describes behaviour from before it changed.
    not: >-
      Behaviour somebody disagrees with. A page that accurately describes a
      decision is not a documentation defect — the disagreement is with the
      decision, and that is `enhancement`.
    examples:
      - "docs/guides/warrant.md lists a capability no duty defines"
      - "The installation page pins @v0.1 but the tag does not exist yet"

  - name: question
    description: >-
      Someone asking how to do something with what already ships — which input
      to set, how to write a `not`, why a run decided what it decided.
    not: >-
      A report that the documented way does not work. Somebody who followed the
      page and got a different result is reporting a `bug` even when they were
      polite enough to phrase it as a question.
    examples:
      - "How do I run a duty against a provider with no api key?"
      - "Can the same warrant serve two repositories?"

  - name: invalid
    description: >-
      A thread this project cannot act on at all: advertising, a request for
      unrelated work, an empty template, or a report about somebody else's
      software that arrived here by mistake.
    not: >-
      A thread that is merely short, or written in a language the maintainers do
      not read. Both are real reports, and one of them is exactly what this
      project exists to make readable.

  - name: stale
    create: true
    description: >-
      This issue has had no activity for six months. It is not closed — a
      maintainer can remove the label to reset the clock, or let it stand.
    not: >-
      An issue that is merely quiet. The lifecycle duty applies this label only
      after the inactivity window configured in the `lifecycle:` policy, and
      removes it the moment any activity resumes.

memory:
  recall: 4

# The lifecycle policy that runs on this repository. An inactivity track with
# a generous six-month window, because this project's backlog is small and
# genuine issues should not be hurried. The `close` step is present for
# forward-compatibility but will be skipped until `close` is added to the
# lifecycle capabilities — a step whose capability is withheld by either half
# of the double-gate is skipped whole, never partially applied.
#
# `exempt.labels` names `bug` and `enhancement` because those are maintainer
# decisions, and a stale clock does not overrule a classification. The warrant
# parser requires at least one exempt label before a `close` step may be
# configured, which is exactly the right constraint: permanent escape hatches
# must exist before closing may be configured at all.
lifecycle:
  threads: issues
  tracks:
    - name: stale
      steps:
        - say: >
            This issue has had no activity for six months and has been marked
            stale. A maintainer can remove the label to reset the clock, or
            let it stand — a stale issue is not a closed one.
          label: stale
          after: 180d
        - close: true
          after: 14d
  exempt:
    labels: [bug, enhancement]
