# A blank issue skips every question the forms ask, and the answers to those
# questions are what make a report actionable.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/ecoma-io/reeve/security/advisories/new
    about: Never open a public issue for a vulnerability — use a private security advisory.
  - name: Ask a question or share how you configured it
    url: https://github.com/ecoma-io/reeve/discussions
    about: Provider setups, warrant files, taxonomies, and anything that is not yet a bug or a proposal.
  - name: The Ecoma platform
    url: https://ecoma.io
    about: This repository holds only the maintenance action. Anything about the product itself belongs there.
