name: Bug report
description: The action fails, or behaves differently from what it documents.
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this.

        **If a duty ran and its output is wrong rather than broken**, use the
        _Duty output quality_ form instead — it asks for the input the duty saw,
        which is what turns the report into a test.

        **Do not report a security vulnerability through this form** — follow
        [SECURITY.md](../blob/main/SECURITY.md) instead. That includes anything
        a thread's title or body can make the action do.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before filing
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I redacted my API key from everything I am about to paste.
          required: true

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: The behaviour you observed, without interpretation.
    validations:
      required: true

  - type: textarea
    id: what-should-happen
    attributes:
      label: What should happen instead
      description: And where that expectation comes from — the README, `action.yml`, or another part of the action behaving differently.
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Your workflow file
      description: The job that runs this action, with secrets redacted. This is the single most useful thing in the report.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Run log
      description: |
        The step's output, with the key redacted. Re-running the job with
        `ACTIONS_STEP_DEBUG` set to `true` in repository secrets gives a far more
        useful log — do that first if you can.
      render: text
    validations:
      required: false

  - type: dropdown
    id: stage
    attributes:
      label: Where does it go wrong?
      description: A best guess is fine — "not sure" is a real answer and never held against a report.
      options:
        - Reading the thread from GitHub
        - Loading the warrant, taxonomy, or other repository state
        - Calling the provider
        - The model output came back unusable
        - Scoring or judging the drafts
        - Writing the result back to the thread
        - The action never ran at all
        - Not sure
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider
      description: Which OpenAI-compatible endpoint, and whether it is keyless. Never paste the key.
      placeholder: e.g. api.openai.com, a self-hosted llama.cpp, a keyless free tier
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Read these from the run rather than from memory.
      value: |
        - Action version (the ref in `uses:`):
        - Models configured:
        - Languages configured:
        - Drafts / judge models:
        - Trigger (`issues`, `pull_request_target`, …):
        - Repository visibility (public / private):
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: A link to the affected thread if it is public. Paste text as text rather than as an image where you can.
    validations:
      required: false
