# The `translate` duty.
#
# This file is the contract. The documentation describes it and links here; it
# deliberately does not restate every input, because a copy is only free to
# drift.
#
# A workflow names this directory: `uses: ecoma-io/reeve/translate@v0.1`.
name: Reeve - translate
description: Translate an issue or pull request body into every language your project reads, in the thread's own body, with the author's words kept byte-for-byte and marked official.
author: Ecoma

branding:
  icon: globe
  color: purple

inputs:
  github-token:
    description: >-
      The token used to read and write the thread. `GITHUB_TOKEN` is enough,
      and it is what gives the run recursion prevention: a body this duty edits
      does not start another run. A PAT or an App installation does not get
      that from GitHub, and the fingerprint in the published marker is what
      stops the loop instead.
    required: false
    default: ${{ github.token }}

  number:
    description: >-
      The issue or pull request to translate. Defaults to the thread that
      triggered the workflow, and is what a backfill sets to name an old one.

      An event that carries no thread — a `schedule`, a `push`, a bare
      `workflow_dispatch` — fails red naming the event rather than asking
      GitHub for issue `NaN`.
    required: false
    default: ""

  base-url:
    description: >-
      An OpenAI-compatible `/chat/completions` endpoint. Any provider that
      speaks the protocol works, including one you run yourself and one that
      needs no key.
    required: false
    default: https://api.openai.com/v1

  api-key:
    description: >-
      The provider's key. Leave it empty for a keyless endpoint, which is a
      supported configuration rather than a mistake. Registered as a secret
      before anything can log it.
    required: false
    default: ""

  models:
    description: >-
      Model ids, comma or newline separated, in preference order. The order is
      preference and not last resort: the first one that answers is used, and a
      model that fails is never asked again in the same run.

      `id = Name` gives a model a display name, and everything a person reads —
      the published block, every warning — shows the name instead of the id. A
      model nobody named shows its id. The name is cut at the first `=`, because
      an id is never an assignment and a name may well contain one.
    required: true

  languages:
    description: >-
      What to translate into, comma or newline separated. `en`, or
      `en:English`, or `zh-Hans:简体中文:Hans` — the code alone is enough when
      the code is enough.

      This says nothing about what an author may write in. The language the
      thread was written in is detected and left out of its own translation.

      Ignored once `warrant`'s own `languages:` key is written — the file is
      the whole answer from there, and the run says once which of the two it
      read.
    required: false
    default: en, vi, zh

  warrant:
    description: >-
      Where the permissions live. `edit-body` is this duty's whole capability,
      granted by default — and once a `capabilities:` block is written in this
      file, the enumeration is total: leaving `translate` out of it grants this
      duty nothing, and the run says so rather than guessing. It may also carry
      a `languages:` key, which becomes the whole answer for what to translate
      into once it is written — see `languages` above.

      Missing at this default path, there is no failure: the run keeps its
      defaults, exactly as if the file had granted them explicitly. Point this
      at a path of your own instead, and a file missing there fails the run
      red, because naming a file that is not there is a configuration mistake
      rather than an absence. A file that exists but does not parse always
      fails red, wherever it lives.
    required: false
    default: .github/reeve.yml

  drafts:
    description: >-
      How many translations to ask for per language. Every answer is scored
      deterministically and the best is published. The quality lever that costs
      calls instead of money.
    required: false
    default: "1"

  judge-models:
    description: >-
      A panel of models asked which draft reads best. Comma or newline
      separates seats and every seat is asked — this is a panel, not a fallback
      list — and the deterministic score breaks every tie. Within one seat, `|`
      names models to fall back through: `a | b, c` is two votes, and `b` is
      asked only when `a` could not deliver the first seat's vote. A model that
      has already voted or already failed is skipped by every later seat, so one
      model never counts twice. Empty means no panel, which is the default and a
      perfectly good setting.

      `a | b = Careful` names the seat rather than a model: it is one voter
      called `Careful` whichever of the two delivered its vote.
    required: false
    default: ""

  max-body-chars:
    description: >-
      How much of the author's own text one run reads, or `none` for no
      bound at all. A longer body has its tail left behind, and the
      published block says so rather than pretending otherwise. Raising this
      later translates the rest. `0` is refused — write `none` for that
      meaning instead.

      A body past this bound — including under `none` — is split into
      chunks and translated a piece at a time rather than truncated or sent
      whole in one request; a fenced code block is never split across two of
      them. Every chunk has to succeed for the language to publish at all —
      a language missing its middle paragraph because one chunk ran out of
      models is worse than a language skipped outright, so a single chunk
      failing skips the whole thing.
    required: false
    default: "6000"

  translate-replies:
    description: >-
      Also translate the thread's replies, each detected and fingerprinted on
      its own. Off by default because the ceiling is real: every reply, times
      every language it is missing. One run reads the most recent hundred and
      warns when there were more.
    required: false
    default: "false"

  show-attribution:
    description: >-
      How much of the machinery the published block names. `none` shows the
      language alone, `model` adds the model that wrote the winning draft, and
      `detail` adds its score, how many drafts it beat, and how each judge
      voted.

      `none` is the default because all of it — and the token count besides — is
      already written to the job summary, which is read by the person who
      configured the run rather than by everyone the thread notifies.
    required: false
    default: none

  dry-run:
    description: >-
      Run the whole pipeline, write every output, and change nothing. The block
      that would have been published is printed to the log.
    required: false
    default: "false"

  sweep:
    description: >-
      Work the backlog instead of the one thread this event named: every open
      issue and pull request this duty has not already translated, newest
      created first. Not an escalation of authority — a sweep decides how much
      work a run looks for, never what it is allowed to do to a thread, so the
      same guardrails bound it exactly as they bound a single-thread run.

      Cannot be combined with `number` — set one or the other.
    required: false
    default: "false"

  since:
    description: >-
      The oldest thread a sweep will consider, bounded by when it was opened —
      never by when it was last touched, because this duty's own publishing
      would otherwise push that bound forward under it. Empty for no bound, a
      calendar date (`2026-01-01`), or a duration (`90d`). This is what "no
      archaeology on threads before Reeve adoption" means: point it at the day
      this duty started running here, and everything older stays a deliberate,
      separate backfill rather than something a scheduled run stumbles into.
    required: false
    default: ""

  limit:
    description: >-
      The most threads one sweep will actually process, or `none` for no cap.
      A skip — a thread already carrying this duty's marker — costs nothing
      and does not count against it. Kept modest by default to protect a free
      tier's own rate limit: a keyless provider caps requests by IP, and a
      run that tried the whole backlog in one job would spend most of it
      rotating through 429s instead of finishing a smaller batch for good.
      Raise it, or set `none`, for a paid provider or a deliberate backfill —
      paging follows real demand either way, so a large backlog no longer
      stalls on a hidden ceiling.
    required: false
    default: "50"

  endpoints:
    description: >-
      Additional `alias = url` endpoints, comma or newline separated, each
      with an optional `timeout=<duration>` after the url — for example
      `fast = https://api.example.com/v1 timeout=30s`. A model id then
      routes to one of these with `model@alias`, split at the last `@`
      only when that alias was declared here; a model id with no `@alias`
      still routes to `base-url` as it always has. The alias and url are
      both safe to read back in this run's log.

      A capacity failure — a 429, a 5xx, a timeout — demotes only the
      `model@alias` pair that hit it, so a roster spread across endpoints
      keeps rotating through whatever is left standing. A transport failure
      demotes the whole endpoint, on the grounds that one broken connection
      says nothing about the model asked over it. An auth failure — a 401 or
      403 — is recorded rather than failing the run red immediately, and
      only fails red at the end if every endpoint configured ended up
      auth-failed; see `docs/north-star.md`.
    required: false
    default: ""

  api-keys:
    description: >-
      One `alias = key` per line, comma or newline separated, supplying the
      key for each `endpoints` alias that needs one. Every alias named here
      must also be declared in `endpoints`. Registered as a secret in full —
      the whole value, not just the part after `=` — before anything can log
      it, and before anything else in this input is even parsed.
    required: false
    default: ""

  request-timeout:
    description: >-
      How long one request is allowed to run before it counts as a timeout —
      weather, not a failure — expressed as a whole number of seconds or
      minutes, like `120s` or `2m`. A bare number is refused rather than
      assumed to be seconds, because a silent unit is exactly the kind of
      thing that is only noticed once a request has already hung for the
      wrong amount of time. Applies to `base-url` and to every `endpoints`
      line that names no `timeout=` of its own.
    required: false
    default: 120s

  temperature:
    description: >-
      Sampling temperature, between 0 and 2. Empty is the default and omits
      the field from every request outright, rather than sending some
      assumed default value — some providers reject the field entirely, and
      omitting it is the only setting that works everywhere. Refused outside
      its range rather than clamped, for the same reason `confidence`-style
      thresholds elsewhere in Reeve are: silently sending the wrong number is
      worse than a red run.
    required: false
    default: ""

outputs:
  source-language:
    description: >-
      The detected language code of the thread's body, or empty — empty means
      none of the configured languages wrote it, which is an answer rather than
      a failure.

  translated:
    description: JSON array of the language codes that were published.

  skipped:
    description: >-
      Outside `sweep`: JSON array of the language codes no model could
      translate this run. `[]` on the run where everything worked, never
      unset — a language that failed does not fail the job, so this is what a
      workflow branches on. Under `sweep`: a count of threads already carrying
      this duty's marker, left alone at no cost beyond the listing itself. The
      two modes never run in the same job — `sweep` and `number` are mutually
      exclusive — so the name answers whichever question this run actually
      asked.

  replies-translated:
    description: How many replies got a translation. `0` when `translate-replies` is off.

  starved:
    description: >-
      `true` when every model in `models` failed on capacity this run — a 429,
      a 5xx, a timeout, or a network failure, on every one of them. Weather,
      never a failure by itself: outside `sweep` this run still published
      whatever it drafted before the roster ran dry, and under `sweep` see
      `remaining` for what is left. Worth alerting on if a schedule keeps
      producing it, because that is a quota worth raising rather than a run
      worth retrying.

  processed:
    description: >-
      How many threads a sweep actually processed this run — decided about,
      whether or not anything was published. `0` outside `sweep`.

  remaining:
    description: >-
      Candidates this sweep did not reach — past `limit`, or left behind when
      the roster ran out of capacity. The next sweep starts here. `0` outside
      `sweep`, and `0` when a sweep finished its whole backlog.

runs:
  using: node24
  main: dist/index.js
