# The Marketplace listing, and the one action in this repository that does no
# work.
#
# GitHub reads a Marketplace listing from an `action.yml` at the repository root
# and from nowhere else, while every duty ships from its own subdirectory so a
# workflow can name the one it wants. So this file exists to be listed, and the
# code behind it exists to refuse.
#
# The name has to collide with no existing action, user or organisation, which
# `Reeve` alone would not survive — so the listing carries the brand plus what
# it does, which is also what someone searching the Marketplace actually types.
name: Reeve - multilingual repository upkeep
description: >-
  Automated upkeep for a repository — triage, translation, duplicates, replies,
  lifecycle, documentation synchronisation and dependency maintenance — with
  any OpenAI-compatible model, inside an authority you wrote down.

  This listing is the umbrella: it runs no duty itself, so pin a leaf action to
  run one, e.g. `ecoma-io/reeve/triage@v0.6`. Set `doctor: true` here to check
  your warrant before anything runs.
author: ecoma.io

branding:
  icon: check-square
  color: purple

inputs:
  duty:
    description: >-
      The duty you meant to run. Naming one here does not run it — this action
      cannot run any duty — but it turns a puzzling red job into the `uses:`
      line to write instead, both in the log and as the `leaf-action` output,
      and the job summary names the leaf action that runs it.

      A workflow uses a duty's leaf action directly: `uses:
      ecoma-io/reeve/triage@v0.6`. Under `doctor: true`, naming one here scopes
      the report to it instead — see `doctor` below.
    required: false
    default: ""

  doctor:
    description: >-
      `true` reads your warrant and checks it against this repository instead
      of refusing. Nothing is written anywhere — no label, no comment, no
      commit — this only reports what a duty would do with the configuration
      it finds: every label the warrant or a `lifecycle:` policy names,
      checked against this repository's actual labels; the capabilities each
      duty would effectively have, from the same defaults its own `main.ts`
      reads; and the defaults in play where the file never wrote an opinion.

      `false`, the default, keeps this action doing what it has always done —
      refusing, and naming the duty action you meant to write instead.
    required: false
    default: "false"

  github-token:
    description: >-
      The token `doctor: true` reads labels with. `GITHUB_TOKEN` is enough —
      this action never writes anything, so nothing wider than `issues: read`
      is asked for. Unused when `doctor` is `false`.
    required: false
    default: ${{ github.token }}

  warrant:
    description: >-
      Where the taxonomy and the authority live. Its `duties:` block is the
      whole authority — what each duty may do to a thread, written in your own
      words, checked against the parsed file rather than against the model's
      account of what it was allowed to do. It may also carry a `languages:`
      key and a `lifecycle:` policy, both checked by `doctor: true` the same
      way. Every leaf action reads the same file.

      Missing at this default path, there is no failure: `doctor: true`
      reports the narrowest authority this build knows — labelling only, from
      this repository's own label descriptions, leaving out any label GitHub
      has no description for. Point this at a path of your own instead, and a
      file missing there is reported red, because naming a file that is not
      there is a configuration mistake rather than an absence. A file that
      exists but does not parse is always reported red, wherever it lives.
      Unused when `doctor` is `false`.
    required: false
    default: .github/reeve.yml

outputs:
  leaf-action:
    description: >-
      The `uses:` line to write instead of this one, when `duty` named a duty
      this repository builds — `ecoma-io/reeve/<duty>@<the ref you pinned>`.
      Set only in the refusal mode: the run still fails red, this is the
      corrected line machine-readable. Unset when `duty` named nothing or
      something this repository does not build, and unset under `doctor: true`.

  problems:
    description: >-
      How many findings `doctor: true` reported that would refuse a duty at
      runtime — 0 when the configuration is healthy. Unset when `doctor` is
      `false`.

runs:
  using: node24
  main: dist/index.js
