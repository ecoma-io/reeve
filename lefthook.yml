# Local gates, version-controlled rather than left to whatever hooks a
# contributor's own git config happens to have. `pnpm install` runs `prepare`
# (`lefthook install`), which wires the jobs below into `.git/hooks` for
# everyone who clones the repository — a hook that only exists on one
# machine catches nothing on anyone else's.
#
# These two hooks exist to catch the mistakes that have nothing to do with
# what a commit changes: a message conventional-commits can't parse, and a
# staged file that isn't formatted or doesn't lint. Everything that depends
# on *what* changed — typecheck, test, the bundle rebuild — stays in CI's
# Verify gate (.github/workflows/ci.yml), never here. A hook slow enough to
# notice is a hook contributors learn to skip with --no-verify, which
# defeats it more thoroughly than not having it at all.

commit-msg:
  jobs:
    - name: commitlint
      # Same rules CI re-checks the pull request title against
      # (commitlint.config.mjs) — one definition of a valid message, not
      # two. `{1}` is the path lefthook passes a commit-msg hook: the file
      # git already wrote the draft message into.
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{ts,mts,cts,js,mjs,cjs,json,yml,yaml,md}"
      exclude:
        # Committed build output, one bundle per duty (dist/, translate/dist/,
        # triage/dist/, ...). It is esbuild's, not a contributor's — reformatting
        # it here would just fight the next `pnpm build` for no reason, so
        # .prettierignore already excludes it. Repeated here so the hook stays
        # correct on its own, without relying on that file's contents.
        - "dist/**"
        - "*/dist/**"
      run: pnpm exec prettier --check {staged_files}

    - name: eslint
      glob: "*.{ts,mts,cts,js,mjs,cjs}"
      exclude:
        # Same reasoning as above: eslint.config.mjs already ignores every
        # dist/ at any depth, but a hook that only works because another
        # file agrees with it is one edit away from not working.
        - "dist/**"
        - "*/dist/**"
        # Dogfood CLI tools outside src/ are not in the tsconfig project,
        # so eslint cannot resolve their types. The canonical conformance
        # code lives in src/duties/dependa/conformance/ which IS checked.
        - "dogfood/**"
      run: pnpm exec eslint {staged_files}

    - name: doc-links
      # A broken reference can be in a file untouched by this commit — the
      # failure is the tree, not a staged path — so this gate runs on every
      # commit rather than on a glob. It fails a docs/ page that links outside
      # docs/ and any markdown link or prose citation to a path that does not
      # exist; the same gate also runs at edit time through the editor hooks.
      run: pnpm check-docs-links
